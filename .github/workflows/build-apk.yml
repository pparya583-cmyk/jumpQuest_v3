name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Siapkan folder web (www)
        run: |
          node --check game.js
          mkdir www
          cp index.html game.js www/
          cp -r assets www/assets

      - name: Buat proyek Android
        run: |
          npx cap add android
          # paksa landscape
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          python3 scripts/patch-android.py
          npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: JumpQuest-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
